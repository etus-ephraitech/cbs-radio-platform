name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: cbs_radio_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, mysqli, bcmath, curl
          coverage: none

      - name: Copy test environment file
        run: cp .env.example .env.testing

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Code style check (PSR-12)
        run: composer cs-check

      - name: Static analysis
        run: composer analyse

      - name: Run migrations against test DB
        env:
          database.default.hostname: 127.0.0.1
          database.default.database: cbs_radio_platform_test
          database.default.username: root
          database.default.password: ''
          CI_ENVIRONMENT: testing
        run: php spark migrate --all

      - name: Run test suite
        env:
          database.default.hostname: 127.0.0.1
          database.default.database: cbs_radio_platform_test
          database.default.username: root
          database.default.password: ''
          CI_ENVIRONMENT: testing
        run: composer test
